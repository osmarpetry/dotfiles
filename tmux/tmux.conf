# ~/.config/tmux/tmux.conf — symlinked from dotfiles by link.sh
#
# Worktree workflow: workmux drives git worktrees + tmux targets.
# Two discovery surfaces over the same actions:
#   prefix + w      -> worktree-mode key table, hints render in the status bar
#   C-Space / p+Spc -> tmux-which-key popup, +Worktrees submenu (same keys)

# --- base ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# --- worktree mode ------------------------------------------------------
# tmux key tables are one-shot: each binding runs and drops back to root.
bind w switch-client -T worktree-mode

bind -T worktree-mode a command-prompt -p "new worktree branch:" "run-shell '$HOME/.local/bin/wm-add -- \"%%\"'"
bind -T worktree-mode b display-popup -E -w 70% -h 60% "$HOME/.local/bin/wm-add --pick"
bind -T worktree-mode s display-popup -E -w 80% -h 70% "$HOME/.local/bin/wm-switch"
bind -T worktree-mode d display-popup -E -w 90% -h 85% "workmux dashboard"
bind -T worktree-mode g run-shell "workmux sidebar"
bind -T worktree-mode y run-shell "$HOME/.local/bin/wm-sync"
bind -T worktree-mode r display-popup -E -w 80% -h 70% "$HOME/.local/bin/wm-remove"
bind -T worktree-mode m display-popup -E -w 80% -h 70% "workmux merge"
bind -T worktree-mode l display-popup -E -w 80% -h 70% "workmux list --pr; read -k1"
bind -T worktree-mode Enter switch-client -T root
bind -T worktree-mode Escape switch-client -T root
bind -T worktree-mode C-c switch-client -T root
bind -T worktree-mode q switch-client -T root

# --- cheatsheet -----------------------------------------------------------
bind ? display-popup -w 80% -h 80% -E "cat $HOME/.config/tmux/cheatsheet.md | less"

# --- status bar ---------------------------------------------------------
# The hint bar is driven by client_key_table, the same mechanism zellij uses
# for its mode indicator.
set -g status-interval 1
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 40
set -g status-right-length 220
set -g status-left "#[bg=colour109,fg=colour235,bold] #S #[default] "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=colour238,fg=colour223,bold] #I #W "
set -g pane-active-border-style "fg=colour109"
set -g pane-border-style "fg=colour238"
set -g message-style "bg=colour214,fg=colour235"

set -g status-right "#{?#{==:#{client_key_table},worktree-mode},#[bg=colour214,fg=colour235,bold] WORKTREE #[bg=colour238,fg=colour223,nobold] a add  b branch  s switch  d dash  g sidebar  y sync  r rm  m merge  esc exit ,#[fg=colour245]C-Space menu | prefix+w worktree }"

# --- plugins ------------------------------------------------------------
# The plugin's XDG mode needs GNU realpath --relative-to, which macOS lacks, so
# the menu config is installed to the plugin's own gitignored config.yaml path.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

if-shell -b '[ -x "$HOME/.config/tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
